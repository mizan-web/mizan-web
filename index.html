
<!DOCTYPE html>
<html>
<head>
    <title>Web Mizan</title>
    <style>
        body {
            background-color: #fff2e6;
            font-family: Arial;
            text-align: center;
            padding: 40px;
            margin: 0;
        }
        .kotak {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
            max-width: 500px;
            margin: 0 auto;
        }
        img {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ff6600;
            margin-bottom: 20px;
        }
        h1 {
            color: #ff6600;
            font-size: 30px;
            margin: 10px 0;
        }
        p {
            color: #444;
            font-size: 18px;
            line-height: 1.8;
        }
        hr {
            border: none;
            border-top: 2px solid #ff6600;
            margin: 25px 0;
        }
    </style>
</head>
<body>
    <div class="kotak">
        <img src="https://i.imgur.com/4ZKtQWY.jpg" alt="Foto Mizan">
        
        <h1>🌟 Selamat Datang 🌟</h1>
        
        <p>Halo! Nama saya <strong style="color:#ff6600; font-size:22px;">Mizan</strong></p>
        
        <p>Ini web pertama yang saya buat sendiri, dari nol sampai jadi!</p>
        
        <p>Saya senang sekali bisa punya web sendiri 😊</p>
        
        <hr>
        
        <p>Terima kasih sudah berkunjung! Semoga suka ya 🙏</p>
    </div>
</body>
</html>
